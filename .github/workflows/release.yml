name: Build and publish STORMFORGED

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - SOURCES.md
      - RELEASE_NOTES.md
      - cart.json
      - tools/make_label.py
      - .github/workflows/release.yml

permissions:
  contents: write

concurrency:
  group: stormforged-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: 1.0.0
      TAG: v1.0.0
      CART: kanto_stormforged-1.0.0.g1rcart
      PACKAGE: KANTO_STORMFORGED_v1.0.0.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate cartridge artwork
        run: python3 tools/make_label.py label.png

      - name: Fetch official Gen1Recomp cartkit
        run: |
          curl -fsSL --retry 3 \
            -o "$RUNNER_TEMP/cartkit.py" \
            https://raw.githubusercontent.com/bryanthaboi/gen1recomp/dev/tools/cartkit.py
          python3 "$RUNNER_TEMP/cartkit.py" selftest --quiet

      - name: Validate and pack cart
        run: |
          mkdir -p dist
          python3 "$RUNNER_TEMP/cartkit.py" validate . --strict
          python3 "$RUNNER_TEMP/cartkit.py" pack . -o "dist/$CART"

      - name: Build complete distribution ZIP
        run: |
          rm -rf staging
          mkdir -p staging/KANTO_STORMFORGED
          cp README.md SOURCES.md RELEASE_NOTES.md cart.json label.png "dist/$CART" staging/KANTO_STORMFORGED/
          (cd staging && zip -9 -r "../dist/$PACKAGE" KANTO_STORMFORGED)
          (cd dist && sha256sum "$CART" "$PACKAGE" > sha256sums.txt)
          cat dist/sha256sums.txt

      - name: Commit generated label to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add label.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate STORMFORGED cartridge label [skip ci]"
            git push origin HEAD:main
          fi

      - name: Publish latest GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/$CART" "dist/$PACKAGE" dist/sha256sums.txt --clobber
            gh release edit "$TAG" \
              --title "KANTO: STORMFORGED v$VERSION" \
              --notes-file RELEASE_NOTES.md \
              --latest
          else
            gh release create "$TAG" \
              --target main \
              --title "KANTO: STORMFORGED v$VERSION" \
              --notes-file RELEASE_NOTES.md \
              --latest \
              "dist/$CART" \
              "dist/$PACKAGE" \
              dist/sha256sums.txt
          fi
